// site-demos: Java sources for the website live demos, compiled to JavaScript
// with the TeaVM Gradle plugin (0.15.0) by the site.yml GitHub Action.
plugins {
    id 'java'
    id 'org.teavm' version '0.15.0'
}

// TeaVM 0.15 and the current NGE TeaVM platform are Java 17 artifacts. The
// core library stays Java 11-compatible, while this browser-only module opts
// into the newer bytecode level explicitly.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

configurations.matching { it.name.endsWith('CompileClasspath') || it.name.endsWith('RuntimeClasspath') }.configureEach {
    attributes.attribute(
        org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
        17
    )
}

def snapshotBuild = rootProject.version.toString().endsWith('-SNAPSHOT')
def ngePlatformVersion = snapshotBuild
    ? libs.versions.ngePlatformSnapshot.get()
    : libs.versions.ngePlatform.get()

repositories {
    mavenCentral()
    if (snapshotBuild) {
        maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    }
}

// Older release tags may still configure mavenLocal() in their root build.
// A release must exercise published dependencies, not a developer's local snapshot.
if (!snapshotBuild) {
    rootProject.allprojects {
        repositories.removeAll { it.name == 'MavenLocal' }
    }
}

dependencies {
    implementation project(':nostr4j')
    implementation "org.ngengine:nge-platform-teavm:${ngePlatformVersion}"
    implementation(snapshotBuild ? libs.bech32.snapshot : libs.bech32)
    implementation(snapshotBuild ? libs.lnurl4j.snapshot : libs.lnurl4j)
    implementation(snapshotBuild ? libs.bolt11.snapshot : libs.bolt11)
    implementation libs.jakarta.annotation.api
    implementation "org.slf4j:slf4j-api:${libs.versions.slf4j.get()}"
}

// One TeaVM JS bundle per demo. Each bundle installs window.<Global> via JsBridge.
// The GitHub Action stages each bundle in docs/assets/demos/<name>/.
//
// NOTE: these task/property names were verified against the published
// teavm-gradle-plugin 0.15.0 jar (javap): the task class is
// org.teavm.gradle.tasks.TeaVMTask with mainClass/targetFileName/outputDir;
// the JS module type lives on the teavm extension (js.moduleType).
def demoMains = [
    quickstart: 'org.ngengine.site.demos.quickstart.QuickStartDemo',
    relay: 'org.ngengine.site.demos.relay.RelayFetchDemo',
    nwc  : 'org.ngengine.site.demos.nwc.NWCDemo',
    rtc  : 'org.ngengine.site.demos.rtc.RTCPingDemo',
    game : 'org.ngengine.site.demos.game.P2pSeasGame',
]

teavm {
    js {
        moduleType.set(org.teavm.gradle.api.JSModuleType.ES2015)
        obfuscated.set(true)
    }
}

demoMains.each { name, mainClassName ->
    // TeaVMTask is an abstract base class in TeaVM 0.15.0. Gradle 9 refuses
    // to decorate it because setupBuilder(...) is intentionally left
    // abstract; use the concrete JavaScript task for each browser bundle.
    tasks.register("teavmDemo_${name}", org.teavm.gradle.tasks.GenerateJavaScriptTask) {
        group = 'build'
        description = "Compile the '${name}' site demo to JavaScript with TeaVM"
        mainClass.set(mainClassName)
        targetFileName.set('demo.js')
        outputDir.set(layout.buildDirectory.dir("teavm/${name}").map { it.asFile })
        // Mirror the classpath assembled by TeaVM's built-in
        // generateJavaScript task. In particular, teavmClasspath contributes
        // TeaVM's Java class library; runtimeClasspath alone does not contain
        // java.lang.Object from TeaVM's point of view.
        classpath.from(
            sourceSets.main.output,
            configurations.teavmClasspath,
            sourceSets.teavm.output,
            sourceSets.teavm.runtimeClasspath
        )
        sourceFiles.from(sourceSets.main.allSource, sourceSets.teavm.allSource)
        moduleType.set(org.teavm.gradle.api.JSModuleType.ES2015)
        // Keep browser delivery compact; the readable examples remain in Java.
        obfuscated.set(true)
        doLast {
            // NGE's TeaVM platform declares this native ES module through
            // @JSModule. TeaVM references it but does not copy it into a
            // custom task's output directory, so stage the pinned dependency
            // beside each generated entry point.
            project.copy {
                from(
                    configurations.runtimeClasspath
                        .filter { it.exists() }
                        .collect { it.isDirectory() ? it : zipTree(it) }
                )
                include 'org/ngengine/platform/teavm/TeaVMBinds.bundle.js'
                include 'org/ngengine/platform/teavm/TeaVMBinds.bundle.js.LICENSE.txt'
                into outputDir.get()
                duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            }
        }
    }
}

tasks.register('buildAllDemos') {
    group = 'build'
    description = 'Compile all site demos to JavaScript with TeaVM'
    dependsOn demoMains.keySet().collect { "teavmDemo_${it}" }
}

tasks.register('jvmSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Run deterministic, platform-free checks for the P2P Seas Game game logic'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.ngengine.site.demos.game.JvmSmokeTest')
}

tasks.named('check') {
    dependsOn tasks.named('jvmSmokeTest')
}

// ---------------------------------------------------------------------------
// Backend: plain JVM programs (not compiled to the browser).
// - QuickStart: the copyable "Getting started" example, compiled and
//   smoke-tested so the docs never drift from working code.
// - org.ngengine.site.demos.backend: the site's demo backend (DemoServer),
//   run by the operator in Docker; see src/backend/docker/.
// Shares protocol constants with the browser demo via sourceSets.main.output.
// ---------------------------------------------------------------------------
sourceSets {
    backend {
        java { srcDir 'src/backend/java' }
        // The backend reuses protocol constants from the main (browser) sources.
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.named('compileBackendJava') {
    options.release = 21
}

tasks.register('quickstartJvmSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Run the copyable JVM quick start against the public relay'
    dependsOn tasks.named('backendClasses')
    classpath = sourceSets.backend.runtimeClasspath
    mainClass.set('QuickStart')
}

tasks.register('documentationSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Check event, filter, cache and gift-wrap examples without network access'
    dependsOn tasks.named('backendClasses')
    classpath = sourceSets.backend.runtimeClasspath
    mainClass.set('org.ngengine.site.demos.DocumentationSmokeTest')
}

tasks.named('check') {
    dependsOn tasks.named('documentationSmokeTest')
}

['backendCompileClasspath', 'backendRuntimeClasspath'].each { configurationName ->
    configurations.named(configurationName) {
        attributes.attribute(
            org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
            21
        )
    }
}

dependencies {
    backendImplementation project(':nostr4j')
    backendImplementation "org.ngengine:nge-platform-jvm:${ngePlatformVersion}"
    backendImplementation(snapshotBuild ? libs.bech32.snapshot : libs.bech32)
    backendImplementation(snapshotBuild ? libs.lnurl4j.snapshot : libs.lnurl4j)
    backendImplementation(snapshotBuild ? libs.bolt11.snapshot : libs.bolt11)
    backendImplementation libs.jakarta.annotation.api
    backendImplementation "org.slf4j:slf4j-api:${libs.versions.slf4j.get()}"
    backendImplementation libs.slf4j.jdk14
}

tasks.register('verifyDemoDependencies') {
    group = 'verification'
    description = 'Verify browser and backend dependencies match the library build mode and platform version'
    doLast {
        logger.lifecycle("Site library version: {}; NGE Platform: {}; mode: {}", rootProject.version,
            ngePlatformVersion, snapshotBuild ? 'snapshot' : 'release')
        def classpaths = [configurations.compileClasspath, configurations.runtimeClasspath,
            configurations.backendCompileClasspath, configurations.backendRuntimeClasspath,
            project(':nostr4j').configurations.compileClasspath]
        classpaths.each { configuration ->
            configuration.resolvedConfiguration.rethrowFailure()
            configuration.incoming.resolutionResult.allComponents.each { component ->
                def module = component.moduleVersion
                if (module == null) return
                if (!snapshotBuild && module.version.toUpperCase().contains('SNAPSHOT')) {
                    throw new GradleException("Release contains a snapshot dependency: ${module}")
                }
                if (module.group == 'org.ngengine' && module.name.startsWith('nge-platform-') &&
                    module.version != ngePlatformVersion) {
                    throw new GradleException("NGE Platform version mismatch: ${module}; expected ${ngePlatformVersion}")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyDemoDependencies')
}

tasks.register('backendJar', Jar) {
    group = 'build'
    description = 'Build the same-origin demo backend, isolated ping rooms and P2P Seas Game bots'
    dependsOn tasks.named('backendClasses'), project(':nostr4j').tasks.named('jar')
    archiveBaseName.set('demo-backend')
    from sourceSets.backend.output
    from sourceSets.main.output
    from { sourceSets.backend.runtimeClasspath.filter { it.exists() }.collect { it.isDirectory() ? it : zipTree(it) } }
    // Dependency signatures are valid only for their original archives. Once
    // classes are merged into this fat jar, retaining them makes the JVM reject
    // the application with "Invalid signature file digest" before main starts.
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/*.EC'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'org.ngengine.site.demos.backend.DemoServer' }
}
