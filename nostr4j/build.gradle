plugins {
    id 'java-library'
}

dependencies {
    def ngePlatformVersion = project.version.endsWith('-SNAPSHOT') ? libs.versions.ngePlatformSnapshot.get() : libs.versions.ngePlatform.get()
    def bech32Version = project.version.endsWith('-SNAPSHOT') ? libs.versions.bech32Snapshot.get() : libs.versions.bech32.get()
    def lnurlVersion = project.version.endsWith('-SNAPSHOT') ? libs.versions.lnurlSnapshot.get() : libs.versions.lnurl.get()
    def bolt11Version = project.version.endsWith('-SNAPSHOT') ? libs.versions.bolt11Snapshot.get() : libs.versions.bolt11.get()
    
    testImplementation libs.junit4
    testImplementation project(':nostr4j-turn-server')
    compileOnly "org.ngengine:nge-platform-common:${ngePlatformVersion}"
    testImplementation "org.ngengine:nge-platform-jvm:${ngePlatformVersion}"
    testImplementation libs.gson
    implementation libs.jakarta.annotation.api

    api "org.ngengine:bech32:${bech32Version}"
    api "org.ngengine:lnurl4j:${lnurlVersion}"
    api "org.ngengine:bolt11:${bolt11Version}"
}
 

tasks.named('test') {
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

tasks.register('cacheTest', Test) {
    description = 'Runs deterministic cache/priority/fetch regressions without relay or wallet services.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnit()
    filter {
        includeTestsMatching 'org.ngengine.nostr4j.unit.TestAnonSigner'
        includeTestsMatching 'org.ngengine.nostr4j.unit.TestEventCache'
        includeTestsMatching 'org.ngengine.nostr4j.unit.TestEventStore'
        includeTestsMatching 'org.ngengine.nostr4j.unit.TestVStoreEventCache'
        includeTestsMatching 'org.ngengine.nostr4j.unit.TestPriorityCacheRelay'
        includeTestsMatching 'org.ngengine.nostr4j.unit.TestConnectionBudget'
        includeTestsMatching 'org.ngengine.nostr4j.unit.TestBestEffortPropagation'
        includeTestsMatching 'org.ngengine.blossom4j.TestBlossomIntegrity'
        includeTestsMatching 'org.ngengine.blossom4j.TestBlossomMedia'
        includeTestsMatching 'org.ngengine.nostr4j.unit.TestRelayLoopScheduling'
        includeTestsMatching 'org.ngengine.nostr4j.unit.TestSignedEventEncodingCache'
        includeTestsMatching 'org.ngengine.nostr4j.unit.TestUnicodeCanonicalEvents'
        includeTestsMatching 'org.ngengine.nostr4j.TestNostrPoolAckPolicy'
        includeTestsMatching 'org.ngengine.nostr4j.TestNostrSubscription'
        includeTestsMatching 'org.ngengine.nostr4j.nip47.TestNWCCaching'
        includeTestsMatching 'org.ngengine.wallets.nip47.TestNWCAuth'
    }
}
 
