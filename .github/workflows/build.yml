name: Build and Publish

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 0'
  push: 
  pull_request:
  release:
      types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
      
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Select build version
      run: |
        version=""
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version=${GITHUB_REF_NAME#v}
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || [[ "$version" == *SNAPSHOT* ]]; then
                echo "Invalid release version: $GITHUB_REF_NAME" >&2
                exit 1
            fi
        fi
        printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"

    - name: Build
      run: |
        ./gradlew --no-daemon build javadoc


    - name: Publish Snapshot
      if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && github.event_name != 'release'
      env:
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |       
        ./gradlew --no-daemon publishAllPublicationsToDistFolder publishToSonatype  --info

    - name: Publish Release
      if: github.event_name == 'release' && github.event.action == 'published'
      env:
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        ./gradlew --no-daemon publishAllPublicationsToDistFolder publishToSonatype closeAndReleaseSonatypeStagingRepository  --info


    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: dist

  release-site:
    name: Build and deploy release website
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: NostrGameEngine/nostr4j/.github/workflows/site.yml@gh-pages
    with:
      library_ref: ${{ github.event.release.tag_name }}
      deploy_live: true
