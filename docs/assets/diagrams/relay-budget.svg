<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-labelledby="title desc">
<title id="title">A connection budget selects active relays</title><desc id="desc">With budget two, relay A and relay B are selected. Relay C is on standby. A read with a hint for C can temporarily keep C connected above the budget.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#91d7b7"/></marker></defs>
<rect width="560" height="330" rx="16" fill="#171124"/>
<g font-family="system-ui,sans-serif"><rect x="155" y="20" width="250" height="60" rx="10" fill="#30203f" stroke="#69577e"/><text x="280" y="57" font-size="20" fill="#eee8f5" text-anchor="middle">Pool: budget = 2</text><path d="M230 90V115H100V145" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><path d="M280 90V145" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><path d="M330 90V115H460V145" fill="none" stroke="#91d7b7" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="20" y="155" width="160" height="70" rx="10" fill="#30203f" stroke="#69577e"/><text x="100" y="184" font-size="20" fill="#eee8f5" text-anchor="middle">Relay A</text><text x="100" y="210" font-size="20" fill="#eee8f5" text-anchor="middle">Connected</text><rect x="200" y="155" width="160" height="70" rx="10" fill="#30203f" stroke="#69577e"/><text x="280" y="184" font-size="20" fill="#eee8f5" text-anchor="middle">Relay B</text><text x="280" y="210" font-size="20" fill="#eee8f5" text-anchor="middle">Connected</text><rect x="380" y="155" width="160" height="70" rx="10" fill="#30203f" stroke="#69577e"/><text x="460" y="184" font-size="20" fill="#eee8f5" text-anchor="middle">Relay C</text><text x="460" y="210" font-size="20" fill="#eee8f5" text-anchor="middle">Standby</text><text x="280" y="270" font-size="20" fill="#eee8f5" text-anchor="middle">A read can request C with a relay hint.</text><text x="280" y="300" font-size="19" fill="#eee8f5" text-anchor="middle">Required connections can exceed the budget.</text></g></svg>
