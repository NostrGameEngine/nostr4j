<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-labelledby="title desc">
<title id="title">Store the file in Blossom and share its URL in Nostr</title><desc id="desc">The app uploads a file to a Blossom server. Blossom returns a URL and hash. The app includes the URL in a Nostr event; readers retrieve the file from Blossom.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#91d7b7"/></marker></defs>
<rect width="560" height="330" rx="16" fill="#171124"/>
<g font-family="system-ui,sans-serif"><rect x="20" y="20" width="160" height="55" rx="10" fill="#30203f" stroke="#69577e"/><text x="100" y="54.5" font-size="20" fill="#eee8f5" text-anchor="middle">Your app</text><rect x="350" y="20" width="190" height="55" rx="10" fill="#30203f" stroke="#69577e"/><text x="445" y="54.5" font-size="20" fill="#eee8f5" text-anchor="middle">Blossom server</text><path d="M185 42H340" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><text x="265" y="30" font-size="18" fill="#eee8f5" text-anchor="middle">Upload file</text><path d="M440 85V120H105V150" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><text x="280" y="111" font-size="20" fill="#eee8f5" text-anchor="middle">File URL + SHA-256</text><rect x="20" y="160" width="240" height="65" rx="10" fill="#30203f" stroke="#69577e"/><text x="140" y="186.5" font-size="20" fill="#eee8f5" text-anchor="middle">Nostr event</text><text x="140" y="212.5" font-size="20" fill="#eee8f5" text-anchor="middle">Contains the file URL</text><path d="M270 190H310" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><rect x="320" y="160" width="220" height="65" rx="10" fill="#30203f" stroke="#69577e"/><text x="430" y="186.5" font-size="20" fill="#eee8f5" text-anchor="middle">Reader</text><text x="430" y="212.5" font-size="20" fill="#eee8f5" text-anchor="middle">Opens the URL</text><path d="M470 150V85" fill="none" stroke="#91d7b7" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="280" y="280" font-size="20" fill="#eee8f5" text-anchor="middle">The file stays on the Blossom server.</text></g></svg>
