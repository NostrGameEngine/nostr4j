<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" role="img" aria-labelledby="title desc">
<title id="title">A conversation using Java streams</title><desc id="desc">Alice writes hello to her output stream. Bob reads it from his input stream and writes a reply. Alice reads the reply, then sends end-of-stream.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#91d7b7"/></marker></defs>
<rect width="560" height="310" rx="16" fill="#171124"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#eee8f5">
<rect x="20" y="20" width="150" height="55" rx="10" fill="#30203f"/><rect x="390" y="20" width="150" height="55" rx="10" fill="#30203f"/>
<text x="95" y="55" font-size="24">Alice</text><text x="465" y="55" font-size="24">Bob</text>
<path d="M95 85V285M465 85V285" stroke="#69577e" stroke-dasharray="5 6"/>
<path d="M100 135H455M460 205H105M100 270H455" stroke="#91d7b7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="280" y="115" font-size="20">1. Write / read “hello”</text>
<text x="280" y="185" font-size="20">2. Write / read reply</text>
<text x="280" y="250" font-size="20">3. End of stream</text>
</g></svg>
