<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
<title id="title">Create one room key and share it with invited peers</title>
<desc id="desc">The creator generates one room key pair. An authenticated encrypted invitation outside RTC signaling gives the same room key to Alice and Bob. Alice and Bob each keep a separate personal signer.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#91d7b7"/></marker></defs>
<rect width="560" height="420" rx="16" fill="#171124"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#eee8f5">
<rect x="130" y="20" width="300" height="65" rx="10" fill="#30203f"/>
<text x="280" y="48" font-size="22">Create one room key pair</text>
<text x="280" y="72" font-size="18">new NostrKeyPair()</text>
<path d="M280 95V135" stroke="#91d7b7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="145" width="430" height="65" rx="10" fill="#30203f"/>
<text x="280" y="172" font-size="22">Share the room's private key</text>
<text x="280" y="196" font-size="18">Encrypted invitation outside RTC signaling</text>
<path d="M280 220V245H140V270M280 245H420V270" stroke="#91d7b7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M140 255V270" stroke="#91d7b7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="285" width="240" height="110" rx="10" fill="#30203f"/>
<rect x="300" y="285" width="240" height="110" rx="10" fill="#30203f"/>
<text x="140" y="317" font-size="24">Alice</text><text x="420" y="317" font-size="24">Bob</text>
<text x="140" y="348" font-size="20">Shared room key</text><text x="420" y="348" font-size="20">Shared room key</text>
<text x="140" y="377" font-size="19">Alice's own signer</text><text x="420" y="377" font-size="19">Bob's own signer</text>
</g></svg>
