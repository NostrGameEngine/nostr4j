<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="title desc">
<title id="title">Normal publication and background propagation</title><desc id="desc">Publishing sends to connected relays using the acknowledgement policy. A separate background queue attempts standby relays one at a time on a best-effort basis.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#91d7b7"/></marker></defs>
<rect width="560" height="430" rx="16" fill="#171124"/>
<g font-family="system-ui,sans-serif"><rect x="150" y="20" width="260" height="50" rx="10" fill="#30203f" stroke="#69577e"/><text x="280" y="52" font-size="20" fill="#eee8f5" text-anchor="middle">pool.publish(event)</text><path d="M240 80V100H140V135" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><path d="M320 80V100H420V135" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><rect x="20" y="145" width="240" height="75" rx="10" fill="#30203f" stroke="#69577e"/><text x="140" y="176.5" font-size="20" fill="#eee8f5" text-anchor="middle">Connected relays</text><text x="140" y="202.5" font-size="20" fill="#eee8f5" text-anchor="middle">Normal publication</text><rect x="300" y="145" width="240" height="75" rx="10" fill="#30203f" stroke="#69577e"/><text x="420" y="176.5" font-size="20" fill="#eee8f5" text-anchor="middle">Background queue</text><text x="420" y="202.5" font-size="20" fill="#eee8f5" text-anchor="middle">Standby relays</text><path d="M140 230V270" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><path d="M420 230V270" fill="none" stroke="#91d7b7" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="20" y="280" width="240" height="75" rx="10" fill="#30203f" stroke="#69577e"/><text x="140" y="311.5" font-size="20" fill="#eee8f5" text-anchor="middle">Acknowledgements</text><text x="140" y="337.5" font-size="20" fill="#eee8f5" text-anchor="middle">Your publish policy</text><rect x="300" y="280" width="240" height="75" rx="10" fill="#30203f" stroke="#69577e"/><text x="420" y="311.5" font-size="20" fill="#eee8f5" text-anchor="middle">One relay at a time</text><text x="420" y="337.5" font-size="20" fill="#eee8f5" text-anchor="middle">Best effort</text><text x="280" y="398" font-size="19" fill="#eee8f5" text-anchor="middle">Background attempts do not hold up publication.</text></g></svg>
