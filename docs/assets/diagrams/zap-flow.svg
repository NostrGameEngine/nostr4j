<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="title desc">
<title id="title">From zap request to payment receipt</title><desc id="desc">The app sends a signed zap request to the recipient's LNURL-pay provider and receives an invoice. The payer's wallet pays the invoice. After observing payment the provider publishes a zap receipt to Nostr relays.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#91d7b7"/></marker></defs>
<rect width="560" height="440" rx="16" fill="#171124"/>
<g font-family="system-ui,sans-serif"><path d="M110 80V195M440 80V270" fill="none" stroke="#69577e" stroke-dasharray="5 6"/><rect x="20" y="20" width="180" height="55" rx="10" fill="#30203f" stroke="#69577e"/><text x="110" y="54.5" font-size="20" fill="#eee8f5" text-anchor="middle">Your app</text><rect x="340" y="20" width="200" height="55" rx="10" fill="#30203f" stroke="#69577e"/><text x="440" y="54.5" font-size="20" fill="#eee8f5" text-anchor="middle">LNURL provider</text><path d="M105 110H435" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><text x="280" y="100" font-size="20" fill="#eee8f5" text-anchor="middle">1. Signed zap request</text><path d="M435 170H105" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><text x="280" y="158" font-size="20" fill="#eee8f5" text-anchor="middle">2. Lightning invoice</text><rect x="20" y="205" width="180" height="55" rx="10" fill="#30203f" stroke="#69577e"/><text x="110" y="239.5" font-size="20" fill="#eee8f5" text-anchor="middle">Payer's wallet</text><path d="M105 195V200" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><path d="M210 235H435" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><text x="325" y="222" font-size="20" fill="#eee8f5" text-anchor="middle">3. Payment</text><path d="M440 270V315H280V345" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><text x="280" y="304" font-size="20" fill="#eee8f5" text-anchor="middle">4. Provider publishes receipt</text><rect x="155" y="355" width="250" height="55" rx="10" fill="#30203f" stroke="#69577e"/><text x="280" y="389.5" font-size="20" fill="#eee8f5" text-anchor="middle">Nostr relays: kind 9735</text></g></svg>
