<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" role="img" aria-labelledby="title desc">
<title id="title">Nostr Wallet Connect requests and replies</title><desc id="desc">An app sends an encrypted wallet request through a Nostr relay. The wallet performs an authorized operation and returns an encrypted reply through the relay.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#91d7b7"/></marker></defs>
<rect width="560" height="290" rx="16" fill="#171124"/>
<g font-family="system-ui,sans-serif"><path d="M90 80V215M280 80V215M470 80V215" fill="none" stroke="#69577e" stroke-dasharray="5 6"/><rect x="20" y="20" width="140" height="55" rx="10" fill="#30203f" stroke="#69577e"/><text x="90" y="54.5" font-size="20" fill="#eee8f5" text-anchor="middle">Your app</text><rect x="210" y="20" width="140" height="55" rx="10" fill="#30203f" stroke="#69577e"/><text x="280" y="54.5" font-size="20" fill="#eee8f5" text-anchor="middle">Nostr relay</text><rect x="400" y="20" width="140" height="55" rx="10" fill="#30203f" stroke="#69577e"/><text x="470" y="54.5" font-size="20" fill="#eee8f5" text-anchor="middle">Wallet</text><path d="M90 120H465" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><text x="280" y="105" font-size="20" fill="#eee8f5" text-anchor="middle">Encrypted request</text><text x="470" y="159" font-size="18" fill="#eee8f5" text-anchor="middle">Operation</text><path d="M470 195H95" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><text x="280" y="180" font-size="20" fill="#eee8f5" text-anchor="middle">Encrypted reply</text><text x="280" y="250" font-size="19" fill="#eee8f5" text-anchor="middle">The connection grants specific wallet permissions.</text></g></svg>
