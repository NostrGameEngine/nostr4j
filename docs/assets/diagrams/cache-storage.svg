<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="title desc">
<title id="title">One cache, your choice of storage</title><desc id="desc">The Nostr pool reads through a cache relay and event cache. The cache uses your selected event store: in-memory or persistent VStore.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#91d7b7"/></marker></defs>
<rect width="560" height="440" rx="16" fill="#171124"/>
<g font-family="system-ui,sans-serif"><rect x="130" y="20" width="300" height="48" rx="10" fill="#30203f" stroke="#69577e"/><text x="280" y="51" font-size="20" fill="#eee8f5" text-anchor="middle">NostrPool</text><path d="M280 75V100" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><rect x="130" y="110" width="300" height="48" rx="10" fill="#30203f" stroke="#69577e"/><text x="280" y="141" font-size="20" fill="#eee8f5" text-anchor="middle">NostrCacheRelay</text><path d="M280 165V190" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><rect x="130" y="200" width="300" height="48" rx="10" fill="#30203f" stroke="#69577e"/><text x="280" y="231" font-size="20" fill="#eee8f5" text-anchor="middle">NostrEventCache</text><text x="280" y="285" font-size="19" fill="#eee8f5" text-anchor="middle">Choose the backing event store</text><path d="M280 300V315H140V340" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><path d="M280 315H420V340" fill="none" stroke="#91d7b7" stroke-width="2"  marker-end="url(#arrow)"/><rect x="20" y="350" width="240" height="65" rx="10" fill="#30203f" stroke="#69577e"/><text x="140" y="376.5" font-size="20" fill="#eee8f5" text-anchor="middle">In-memory store</text><text x="140" y="402.5" font-size="20" fill="#eee8f5" text-anchor="middle">Current session</text><rect x="300" y="350" width="240" height="65" rx="10" fill="#30203f" stroke="#69577e"/><text x="420" y="376.5" font-size="20" fill="#eee8f5" text-anchor="middle">VStore store</text><text x="420" y="402.5" font-size="20" fill="#eee8f5" text-anchor="middle">Persistent storage</text></g></svg>
