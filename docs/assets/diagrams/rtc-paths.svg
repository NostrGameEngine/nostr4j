<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" role="img" aria-labelledby="title desc">
<title id="title">Signaling and data take different paths</title><desc id="desc">Nostr relays carry discovery and connection setup between Alice and Bob. Their application data travels over WebRTC, or through a configured Nostr4j TURN fallback.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#91d7b7"/></marker></defs>
<rect width="560" height="390" rx="16" fill="#171124"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#eee8f5">
<rect x="175" y="20" width="210" height="55" rx="10" fill="#30203f"/><text x="280" y="54" font-size="23">Nostr relays</text>
<path d="M95 175V47H165M395 47H465V175" stroke="#bc93d8" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
<text x="280" y="108" font-size="20">Discovery + signaling</text>
<rect x="20" y="180" width="150" height="60" rx="10" fill="#30203f"/><rect x="390" y="180" width="150" height="60" rx="10" fill="#30203f"/>
<text x="95" y="217" font-size="24">Alice</text><text x="465" y="217" font-size="24">Bob</text>
<path d="M180 210H380" stroke="#91d7b7" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="280" y="187" font-size="20">WebRTC data</text>
<path d="M95 250V330H165M395 330H465V250" stroke="#91d7b7" stroke-width="2" fill="none" stroke-dasharray="5 6"/>
<rect x="175" y="300" width="210" height="60" rx="10" fill="#30203f"/><text x="280" y="325" font-size="21">Nostr4j TURN</text><text x="280" y="348" font-size="18">optional fallback</text>
</g></svg>
